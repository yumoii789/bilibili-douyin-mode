<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>沉浸流真浏览器 E2E</title>
<link rel="stylesheet" href="../src/content/douyin-mode.css">
<style>html,body{margin:0;background:#111} #m{position:fixed;right:8px;top:8px;z-index:2147483647;background:#000e;color:#7CFC9A;font:11px/1.35 monospace;padding:6px 8px;margin:0;max-width:520px;white-space:pre-wrap}</style>
<script>
// ---- chrome 桩（含可用的 storage，设置要能读能写）----
var STORE = {};
window.chrome = { runtime: { getManifest: function () { return { version: "0.1.49-e2e" }; }, onMessage: { addListener: function () {} }, sendMessage: function () {} },
  storage: { local: { get: function (k, cb) { var d = { bdmSettings: STORE.bdmSettings }; if (cb) { cb(d); return; } return Promise.resolve(d); },
      set: function (o, cb) { Object.assign(STORE, o); if (cb) { cb(); return; } return Promise.resolve(); },
      remove: function (k, cb) { if (cb) cb(); return Promise.resolve(); } },
    onChanged: { addListener: function () {}, removeListener: function () {} } },
  i18n: { getMessage: function (k) { return k; } } };
// ---- 网络桩：只给沉浸流需要的端点 ----
var OPENED = [];
var _open = window.open; window.open = function (u) { OPENED.push(String(u)); return null; };
var RCMD = { code: 0, data: { item: Array.from({ length: 12 }, function (_, i) { return {
  bvid: "BV1test000" + i, cid: 990 + i, aid: 10000 + i, goto: "av", title: "真浏览器 E2E 的第 " + i + " 条",
  pic: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7", duration: 125,
  owner: { mid: 500 + i, name: "UP" + i, face: "" },
  stat: { view: 1000 * (i + 1), like: 10, danmaku: 3, reply: 9662, coin: 1, favorite: 2, share: 1 }, tname: "分区" + (i % 3) }; }) } };
RCMD.data.item[2] = { goto: "live", roomid: 12345, title: "直播间（E2E）", uname: "主播甲", face: "", online: 88 };
window.fetch = function (u, o) {
  u = String(u); var body = null;
  if (u.indexOf("rcmd") >= 0 || u.indexOf("/wbi/index/top/feed") >= 0) body = RCMD;
  else if (u.indexOf("playurl") >= 0) {
    var m = /qn=(\d+)/.exec(u); var q = m ? Number(m[1]) : 64;
    body = u.indexOf("fnval=4048") >= 0
      ? { code: 0, data: { quality: q, accept_quality: [120, 112, 80, 64, 32, 16], accept_description: ["超清 4K", "高清 1080P+", "高清 1080P", "高清 720P", "清晰 480P", "流畅 360P"],
          dash: { video: [{ id: 80, codecs: "avc1.640028", baseUrl: "data:video/mp4;base64,AAAA" }, { id: 64, codecs: "avc1.64001F", baseUrl: "data:video/mp4;base64,AAAA" }],
                  audio: [{ id: 30280, baseUrl: "data:audio/mp4;base64,AAAA", bandwidth: 128000 }] } } }
      : { code: 0, data: { quality: Math.min(q, 64), accept_quality: [64, 32, 16], accept_description: ["高清 720P", "清晰 480P", "流畅 360P"], durl: [{ url: "data:video/mp4;base64,AAAA", size: 1234 }] } };
  }
  else if (u.indexOf("player/online/total") >= 0) body = { code: 0, data: { total: "94", count: "71", show_switch: { total: true, count: true } } };
  else if (u.indexOf("/x/web-interface/view") >= 0) body = { code: 0, data: { cid: 990, aid: 10000, videos: 1, pages: [{ cid: 990, page: 1, part: "P1" }], desc: "E2E 简介", pubdate: 1690000000, stat: { view: 1, danmaku: 1, like: 1 }, owner: { mid: 1, name: "UP0" } } };
  else body = { code: -404, message: "E2E 未登记端点" };
  return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(body); }, text: function () { return Promise.resolve(JSON.stringify(body)); } });
};
window.onerror = function (m, s, l, c) { var p = document.getElementById("m"); if (p) p.textContent = "ERR " + m + " @" + l + ":" + c + "\n" + p.textContent; };
</script>
<script src="../src/content/settings.js"></script>
<script src="../src/content/desktop-skin.js"></script>
<script src="../src/content/api.js"></script>
<script src="../src/content/ui.js"></script>
<script src="../src/content/player.js"></script>
<script src="../src/content/douyin-mode.js"></script>
</head><body>
<pre id="m">fullscreen…</pre>
<script>
(function () {
  var R = [], ok = function (n, c, d) { R.push((c ? "PASS | " : "FAIL | ") + n + (d === undefined ? "" : " | " + d)); };
  var tick = function (ms) { return new Promise(function (r) { setTimeout(r, ms || 60); }); };
  var root = function () { return document.querySelector(".bdm-root"); };
  var fsBtn = function () { var r = root(); return r ? r.querySelector(".bdm-slide .bdm-btn-full") : null; };
  (async function () {
    try {
      window.__BDM__.douyin.enter();
      await tick(800);
      var b = fsBtn(), bb = b && b.getBoundingClientRect();
      var icon0 = b ? b.innerHTML.length : 0;
      console.log("[E2E-FS] 全屏键中心 x=" + Math.round(bb.left + bb.width / 2) + " y=" + Math.round(bb.top + bb.height / 2) + " 图标长度=" + icon0);
      // 等外部点「全屏」再按 Esc
      var t0 = Date.now(), entered = false, iconChanged = false, sawFull = false;
      while (Date.now() - t0 < 20000) {
        await tick(200);
        if (document.fullscreenElement) { sawFull = true; if (!entered) { entered = true; console.log("[E2E-FS] 已进入全屏（fullscreenElement=" + document.fullscreenElement.tagName + "）"); } }
        var b2 = fsBtn();
        if (b2 && icon0 && b2.innerHTML.length !== icon0) iconChanged = true;
        if (entered && !document.fullscreenElement) break;   // Esc 已退出全屏
      }
      ok("点「全屏」→ 真的进入全屏（真 Fullscreen API + 可信点击）", sawFull, "fullscreenElement=" + !!document.fullscreenElement);
      ok("进入全屏后图标切换（syncFullIcon 生效）", iconChanged, "图标长度变了=" + iconChanged);
      ok("Esc 之后：全屏已退出", !document.fullscreenElement, "fullscreenElement=" + !!document.fullscreenElement);
      ok("Esc 退出全屏时**不应**顺手把沉浸流也关掉（只想退全屏，不该被踢出沉浸模式）", !!root() && window.__BDM__.douyin.isActive() === true,
        "根节点在=" + !!root() + " 沉浸中=" + window.__BDM__.douyin.isActive());
    } catch (e) { R.push("FAIL | 全屏检查抛异常：" + (e && e.message)); }
    R.forEach(function (x) { console.log("[E2E-FS] " + x); });
    document.getElementById("m").textContent = R.join("\n");
  })();
})();
</script></body></html>
