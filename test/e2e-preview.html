<style>html,body{margin:0;background:#111} #m{position:fixed;right:8px;top:8px;z-index:2147483647;background:#000e;color:#7CFC9A;font:11px/1.35 monospace;padding:6px 8px;margin:0;max-width:520px;white-space:pre-wrap}</style>
<script>
// ---- chrome 桩（含可用的 storage，设置要能读能写）----
var STORE = {};
window.chrome = { runtime: { getManifest: function () { return { version: "0.1.49-e2e" }; }, onMessage: { addListener: function () {} }, sendMessage: function () {} },
  storage: { local: { get: function (k, cb) { var d = { bdmSettings: STORE.bdmSettings }; if (cb) { cb(d); return; } return Promise.resolve(d); },
      set: function (o, cb) { Object.assign(STORE, o); if (cb) { cb(); return; } return Promise.resolve(); },
      remove: function (k, cb) { if (cb) cb(); return Promise.resolve(); } },
    onChanged: { addListener: function () {}, removeListener: function () {} } },
  i18n: { getMessage: function (k) { return k; } } };
// ---- 网络桩：只给沉浸流需要的端点 ----
var OPENED = [];
var _open = window.open; window.open = function (u) { OPENED.push(String(u)); return null; };
var RCMD = { code: 0, data: { item: Array.from({ length: 12 }, function (_, i) { return {
  bvid: "BV1test000" + i, cid: 990 + i, aid: 10000 + i, goto: "av", title: "真浏览器 E2E 的第 " + i + " 条",
  pic: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7", duration: 125,
  owner: { mid: 500 + i, name: "UP" + i, face: "" },
  stat: { view: 1000 * (i + 1), like: 10, danmaku: 3, reply: 9662, coin: 1, favorite: 2, share: 1 }, tname: "分区" + (i % 3) }; }) } };
RCMD.data.item[2] = { goto: "live", roomid: 12345, title: "直播间（E2E）", uname: "主播甲", face: "", online: 88 };
window.fetch = function (u, o) {
  u = String(u); var body = null;
  if (u.indexOf("rcmd") >= 0 || u.indexOf("/wbi/index/top/feed") >= 0) body = RCMD;
  else if (u.indexOf("playurl") >= 0) {
    var m = /qn=(\d+)/.exec(u); var q = m ? Number(m[1]) : 64;
    body = u.indexOf("fnval=4048") >= 0
      ? { code: 0, data: { quality: q, accept_quality: [120, 112, 80, 64, 32, 16], accept_description: ["超清 4K", "高清 1080P+", "高清 1080P", "高清 720P", "清晰 480P", "流畅 360P"],
          dash: { video: [{ id: 80, codecs: "avc1.640028", baseUrl: "data:video/mp4;base64,AAAA" }, { id: 64, codecs: "avc1.64001F", baseUrl: "data:video/mp4;base64,AAAA" }],
                  audio: [{ id: 30280, baseUrl: "data:audio/mp4;base64,AAAA", bandwidth: 128000 }] } } }
      : { code: 0, data: { quality: Math.min(q, 64), accept_quality: [64, 32, 16], accept_description: ["高清 720P", "清晰 480P", "流畅 360P"], durl: [{ url: "data:video/mp4;base64,AAAA", size: 1234 }] } };
  }
  else if (u.indexOf("player/online/total") >= 0) body = { code: 0, data: { total: "94", count: "71", show_switch: { total: true, count: true } } };
  else if (u.indexOf("/x/web-interface/view") >= 0) body = { code: 0, data: { cid: 990, aid: 10000, videos: 1, pages: [{ cid: 990, page: 1, part: "P1" }], desc: "E2E 简介", pubdate: 1690000000, stat: { view: 1, danmaku: 1, like: 1 }, owner: { mid: 1, name: "UP0" } } };
  else body = { code: -404, message: "E2E 未登记端点" };
  return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(body); }, text: function () { return Promise.resolve(JSON.stringify(body)); } });
};
window.onerror = function (m, s, l, c) { var p = document.getElementById("m"); if (p) p.textContent = "ERR " + m + " @" + l + ":" + c + "\n" + p.textContent; };
</script>

<script>
(function () {
  var R = [], ok = function (n, c, d) { R.push((c ? "PASS | " : "FAIL | ") + n + (d === undefined ? "" : " | " + d)); };
  var tick = function (ms) { return new Promise(function (r) { setTimeout(r, ms || 60); }); };
  var HOLD = /[?&]hold=1/.test(location.search);   // hold=1：保持沉浸流开启，给外部真实鼠标操作留时间（必须在最前面声明，后面才用得到）
  var root = function () { return document.querySelector(".bdm-root"); };
  var at = function () { var r = root(); return r ? Math.round(r.scrollTop / r.clientHeight) : -1; };
  var slide = function (i) { return document.querySelectorAll(".bdm-slide")[i === undefined ? at() : i]; };
  (async function () {
    try {
      // 真浏览器里 duration 是只读 getter；数据 URI 的假流也没有时长 —— 打桩成 100 秒，
      // 这样进度条的真实坐标换算才有可断言的期望值（假 DOM 里 rect 是固定值，换算根本测不到）。
      Object.defineProperty(HTMLVideoElement.prototype, "duration", { configurable: true, get: function () { return 100; } });
      var _ct = 0;
      Object.defineProperty(HTMLVideoElement.prototype, "currentTime", { configurable: true,
        get: function () { return _ct; }, set: function (v) { _ct = Number(v) || 0; } });
      window.__BDM__.douyin.enter();
      await tick(700);
      ok("进入沉浸流：根节点在页面里、屏数 ≥3", !!root() && document.querySelectorAll(".bdm-slide").length >= 3, "屏数=" + document.querySelectorAll(".bdm-slide").length);
      var v = slide().querySelector("video");
      ok("当前屏有 <video> 且挂了源", !!v && !!v.src, v ? String(v.src).slice(0, 30) : "无 video");
      var row = slide().querySelector(".bdm-dm-row"), ctrl = slide().querySelector(".bdm-ctrl");
      var rr = row && row.getBoundingClientRect(), cr = ctrl && ctrl.getBoundingClientRect();
      ok("两行底栏：发送行在控制条下方且贴底", !!row && !!ctrl && row.getBoundingClientRect().bottom >= window.innerHeight - 2 && cr.top < rr.top, row ? "发送行 top=" + Math.round(rr.top) + " 控制条 top=" + Math.round(cr.top) : "无");
      ok("发送行左组有在线人数、右组有发送按钮", !!row.querySelector(".bdm-online") && !!row.querySelector(".bdm-btn-dmsend"));
      ok("在线人数已渲染（94人正在看）", String((row.querySelector(".bdm-online") || {}).textContent) === "94人正在看", JSON.stringify(String((row.querySelector(".bdm-online") || {}).textContent)));
      var b0 = at();
      slide().querySelector(".bdm-btn-next").dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(500);
      ok("点「下一集」→ 前进一屏", at() === b0 + 1, "idx " + b0 + " → " + at());
      await tick(700);
      var b1 = at();
      window.dispatchEvent(new WheelEvent("wheel", { deltaY: 120, bubbles: true, cancelable: true }));
      await tick(500);
      ok("真滚轮事件 → 前进一屏", at() === b1 + 1, "idx " + b1 + " → " + at());
      await tick(700);
      slide().querySelector(".bdm-btn-dmsend").dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(120);
      var toasts = Array.prototype.slice.call(document.querySelectorAll(".bdm-toast")).map(function (t) { return t.textContent; });
      ok("空内容点「发送」→ 提示请输入弹幕内容", toasts.some(function (t) { return t.indexOf("请输入弹幕内容") >= 0; }), JSON.stringify(toasts.slice(-1)));
      slide().querySelector(".bdm-btn-dmset").dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(200);
      var dmp = slide().querySelector(".bdm-dm-settings");
      ok("点「弹幕设置」→ 面板可见", !!dmp && dmp.getBoundingClientRect().height > 50, dmp ? "高=" + Math.round(dmp.getBoundingClientRect().height) : "无");
      var big = Array.prototype.slice.call(dmp.querySelectorAll(".bdm-set-radio, .bdm-set-switch")).filter(function (b) { return b.textContent === "大"; })[0];
      if (big) { big.dispatchEvent(new MouseEvent("click", { bubbles: true })); await tick(250); }
      ok("面板点「大」→ 字号设置落盘（dmFont=24）", STORE.bdmSettings && STORE.bdmSettings.dmFont === 24, "dmFont=" + (STORE.bdmSettings || {}).dmFont);
      document.body.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(120);
      var live = slide();
      ok("直播条目 → 降级卡且没有 video 元素", !!live.querySelector(".bdm-degrade") && !live.querySelector("video"), "degrade=" + !!live.querySelector(".bdm-degrade"));
      live.querySelector(".bdm-btn-next").dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(600);
      var vid = slide().querySelector("video");
      if (!vid) { throw new Error("当前屏没有 video（idx=" + at() + "）"); }
      vid.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
      vid.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, button: 2, clientX: 300, clientY: 400 }));
      vid.dispatchEvent(new MouseEvent("mouseup", { bubbles: true, button: 2, clientX: 300, clientY: 400 }));
      await tick(200);
      var menu = slide().querySelector(".bdm-ctx");
      var items = menu ? menu.querySelectorAll(".bdm-ctx-item").length : 0;
      ok("右键（真鼠标事件）→ 菜单出现且项数 ≥12", menu && menu.style.display !== "none" && items >= 12, "项=" + items);
      var report = menu ? Array.prototype.slice.call(menu.querySelectorAll(".bdm-ctx-item")).filter(function (n) { return n.textContent.indexOf("举报") >= 0; })[0] : null;
      if (report) { report.dispatchEvent(new MouseEvent("click", { bubbles: true })); await tick(200); }
      ok("点「举报 / 反馈」→ 打开稿件页面（不是死按钮）", OPENED.some(function (u) { return u.indexOf("/video/") > 0; }), JSON.stringify(OPENED.slice(-1)));
      // ── 真交互：音量滑杆（真实 range 语义）与简介面板（真实异步渲染）──
      var vr = slide().querySelector(".bdm-vol-range"), realVid = slide().querySelector("video");
      vr.value = "30";
      vr.dispatchEvent(new Event("input", { bubbles: true }));
      await tick(150);
      ok("音量滑杆 input → video.volume 真的变成 0.3", Math.abs(realVid.volume - 0.3) < 0.02, "volume=" + realVid.volume);
      slide().querySelector(".bdm-info-more").dispatchEvent(new MouseEvent("click", { bubbles: true }));
      await tick(600);
      var desc = slide().querySelector(".bdm-desc-panel");
      ok("点「简介」→ 面板展开并显示简介正文", !!desc && /E2E 简介/.test(desc.textContent || ""), desc ? "高=" + Math.round(desc.getBoundingClientRect().height) : "无面板");
      // 进度条：把轨道的真实坐标打出来，等外部用真实鼠标点两处（25% / 75%）
      var tr = slide().querySelector(".bdm-seek-track").getBoundingClientRect();
      console.log("[E2E-SEEK] left=" + Math.round(tr.left) + " width=" + Math.round(tr.width) + " y=" + Math.round(tr.top + tr.height / 2) + " 期望 25%→25s、75%→75s");
      var seen = [], tS = Date.now();
      while (Date.now() - tS < (HOLD ? 12000 : 1500)) { await tick(150); var cur = realVid.currentTime; if (seen.indexOf(Math.round(cur)) < 0) seen.push(Math.round(cur)); }
      ok("点进度条 25% / 75% → 按真实坐标换算跳到约 25s / 75s（假 DOM 测不到的换算）",
        seen.some(function (v) { return Math.abs(v - 25) <= 3; }) && seen.some(function (v) { return Math.abs(v - 75) <= 3; }),
        "观察到的时间点=" + JSON.stringify(seen));
      // ── 只有真浏览器能验的两条 CSS 行为 ──
      var r0 = root();
      r0.classList.add("bdm-idle");
      await tick(450);   // 过渡是 0.25s，等不够会量到中间值（我第一版就是 150ms，量到 0.166）
      var opOf = function (sel) { var e = slide().querySelector(sel); return e ? getComputedStyle(e).opacity : "无"; };
      ok("闲置类生效时：控制条 / 进度条 / 发送行 一起淡出（真 CSS，不是只看类名）",
        opOf(".bdm-ctrl") === "0" && opOf(".bdm-seek") === "0" && opOf(".bdm-dm-row") === "0" && getComputedStyle(r0).cursor === "none",
        "ctrl=" + opOf(".bdm-ctrl") + " seek=" + opOf(".bdm-seek") + " dmRow=" + opOf(".bdm-dm-row") + " cursor=" + getComputedStyle(r0).cursor);
      r0.classList.remove("bdm-idle");
      await tick(450);
      ok("移出闲置类后：底栏恢复可见", opOf(".bdm-ctrl") !== "0" && opOf(".bdm-dm-row") !== "0", "ctrl=" + opOf(".bdm-ctrl"));
      // 音量滑块悬停展开：由外部把真实鼠标移上去（下面 7 秒内我一直在采样最大宽度）
      var volSlide = slide().querySelector(".bdm-vol-slide");
      var volBtn = slide().querySelector(".bdm-btn-vol"), vb = volBtn && volBtn.getBoundingClientRect();
      if (vb) { console.log("[E2E-COORD] 音量键中心 x=" + Math.round(vb.left + vb.width / 2) + " y=" + Math.round(vb.top + vb.height / 2)); }
      var maxW = 0, t0 = Date.now();
      while (Date.now() - t0 < (HOLD ? 14000 : 7000)) { await tick(150); var w = volSlide.getBoundingClientRect().width; if (w > maxW) maxW = w; }
      ok("鼠标悬停音量键 → 滑块展开（真 :hover，此前只是从 CSS 推断）", maxW > 60, "最大宽度=" + Math.round(maxW));
      if (HOLD) { console.log("[E2E] （hold 模式：跳过退出检查与收尾）"); }
      else {
      window.__BDM__.douyin.exit();
      await tick(200);
      ok("退出 → 根节点移除、body 滚动恢复", !root() && (document.body.style.overflow === "" || document.body.style.overflow === "visible"), "overflow=" + JSON.stringify(document.body.style.overflow));
      }
    } catch (e) { R.push("FAIL | E2E 抛异常：" + (e && e.message)); }
    R.forEach(function (x) { console.log("[E2E] " + x); });
    var fail = R.filter(function (x) { return x.indexOf("FAIL") === 0; }).length;
    console.log("[E2E] 汇总：" + R.length + " 条，" + fail + " 失败");
    document.getElementById("m").textContent = R.join("\n");
  })();
})();
</script></body></html>
